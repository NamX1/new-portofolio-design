<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#eee9db" />
      <stop offset="1" stop-color="#e2dbc8" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#warm)" />

  <!-- Field marks rather than a figure. This is a placeholder and must never
       be mistaken for a photograph of a person. -->
  <g stroke="#b8ae97" fill="none" stroke-width="1">
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="750" x2="800" y2="750" />
    <line x1="400" y1="0" x2="400" y2="1000" />
  </g>

  <g fill="#b8ae97">
    <rect x="250" y="400" width="300" height="200" />
  </g>

  <rect x="386" y="486" width="28" height="28" fill="#b8390f" />
</svg>
